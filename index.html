<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Usine</title>
<style>
  :root { --noir: #1a1c2c; }
  /* Tout geste appartient au jeu : le navigateur n'en prend aucun. La
     sélection, la loupe d'un appui long, le surlignage du toucher, le rebond
     du défilement et le tiré-lâché sont refusés ici ; `input/pointer.js`
     refuse ce qui ne se dit qu'en JavaScript. */
  html, body { margin: 0; height: 100%; background: var(--noir); overflow: hidden;
               overscroll-behavior: none; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center;
         -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; }
  #scene { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  /* touch-action n'est pas héritée : sans ça le navigateur peut réclamer
     le geste pour lui (zoom, panoramique) et annuler nos événements. */
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block;
           touch-action: none; -webkit-user-drag: none; user-select: none; }
</style>
</head>
<body>
  <div id="scene"><canvas id="jeu"></canvas></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
